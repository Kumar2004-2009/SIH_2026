# Fortinet FortiOS Config File
# Hardware: FortiGate-1000D
# Version: FortiOS v7.2.4 build1396
config system global
    set hostname "FortiGate-1000D"
    set timezone 55
    set admin-sport 443
    set admin-http enable
    set admintimeout 480
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role dmz
    next
end
config firewall policy
    edit 1
        set name "Allow-All-Inbound"
        set srcintf "port1"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
